[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "advisor-gateway"
version = "0.2.0"
description = "Provider-neutral executor-to-advisor escalation loop"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
advisor-gateway = "advisor_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
