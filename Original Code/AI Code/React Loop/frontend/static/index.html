<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>React Loop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0e10;
      --panel: #111318;
      --panel-2: #151820;
      --line: rgba(255,255,255,0.08);
      --line-strong: rgba(255,255,255,0.16);
      --text: rgba(245,248,246,0.84);
      --soft: rgba(245,248,246,0.58);
      --muted: rgba(245,248,246,0.32);
      --accent: #5cffc3;
      --accent-soft: rgba(92,255,195,0.1);
      --warn: #ffcf66;
      --bad: #ff6b7a;
      --ok: #8cff8c;
      --font: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --radius: 6px;
      --shadow: 0 18px 60px rgba(0,0,0,0.28);
    }

    html { height: 100%; background: var(--bg); }
    body {
      min-height: 100%;
      color: var(--text);
      font-family: var(--font);
      font-size: 12px;
      line-height: 1.65;
      background:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px),
        var(--bg);
      background-size: 44px 44px;
      overflow-x: hidden;
    }

    button, textarea { font: inherit; }
    button, a.ghost {
      border: 0.5px solid var(--line);
      border-radius: 4px;
      background: transparent;
      color: var(--soft);
      cursor: pointer;
      transition: color 150ms ease, border-color 150ms ease, background 150ms ease;
    }
    a.ghost { text-decoration: none; display: inline-flex; align-items: center; }
    button:hover:not(:disabled), button:focus-visible:not(:disabled),
    a.ghost:hover, a.ghost:focus-visible {
      color: var(--text);
      border-color: var(--line-strong);
      outline: none;
    }
    button:disabled { opacity: 0.42; cursor: not-allowed; }

    #app {
      min-height: 100svh;
      display: grid;
      grid-template-rows: 46px 1fr;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 18px;
      border-bottom: 0.5px solid var(--line);
      background: rgba(13,14,16,0.86);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      color: var(--text);
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .brand-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 18px rgba(92,255,195,0.65);
      flex: 0 0 auto;
    }
    .topbar-spacer { flex: 1; }
    .topbar .ghost { height: 28px; padding: 0 10px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; }

    .shell {
      display: grid;
      grid-template-columns: minmax(220px, 280px) minmax(0, 1fr);
      min-height: calc(100svh - 46px);
    }

    aside {
      border-right: 0.5px solid var(--line);
      background: rgba(17,19,24,0.72);
      min-width: 0;
    }

    .side-section { border-bottom: 0.5px solid var(--line); }
    .side-head {
      padding: 13px 14px 8px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }
    .run-list, .tool-list { padding: 4px 8px 12px; display: grid; gap: 5px; }
    .run-item, .tool-item {
      width: 100%;
      text-align: left;
      padding: 9px 10px;
      border-color: transparent;
      background: transparent;
      min-width: 0;
    }
    .run-item:hover, .run-item.active { background: rgba(255,255,255,0.035); border-color: var(--line); }
    .run-title, .tool-name {
      display: block;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .run-meta, .tool-desc { display: block; color: var(--muted); font-size: 10px; margin-top: 2px; }
    .tool-item { cursor: default; border: 0.5px solid var(--line); background: rgba(255,255,255,0.015); }
    .tool-desc {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    main {
      min-width: 0;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .composer {
      border-bottom: 0.5px solid var(--line);
      background: rgba(13,14,16,0.58);
      padding: 18px;
    }
    .composer-inner {
      max-width: 980px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 10px;
      align-items: end;
    }
    .podcast-select {
      height: 48px;
      min-width: 180px;
      padding: 0 12px;
      border: 0.5px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255,255,255,0.025);
      color: var(--text);
      font-family: var(--font);
      font-size: 11px;
      cursor: pointer;
      outline: none;
    }
    .podcast-select:hover, .podcast-select:focus-visible { border-color: var(--line-strong); }
    .podcast-select option { background: var(--panel-2); color: var(--text); }
    .input-wrap {
      border: 0.5px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255,255,255,0.025);
      min-width: 0;
    }
    .input-wrap:focus-within { border-color: rgba(92,255,195,0.34); box-shadow: 0 0 0 3px rgba(92,255,195,0.045); }
    textarea {
      display: block;
      width: 100%;
      min-height: 48px;
      max-height: 180px;
      resize: none;
      border: none;
      outline: none;
      padding: 13px 14px;
      background: transparent;
      color: var(--text);
      font-weight: 300;
    }
    textarea::placeholder { color: var(--muted); }
    .run-btn {
      height: 48px;
      min-width: 92px;
      padding: 0 16px;
      color: var(--accent);
      border-color: rgba(92,255,195,0.28);
      background: var(--accent-soft);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 10px;
      font-weight: 600;
    }

    .workspace {
      max-width: 980px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 18px 56px;
      min-width: 0;
    }

    .empty {
      min-height: 48svh;
      display: grid;
      place-items: center;
      color: var(--muted);
      text-align: center;
    }

    .result {
      display: grid;
      gap: 16px;
      animation: fadeUp 260ms ease-out both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-head {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      justify-content: space-between;
      border-bottom: 0.5px solid var(--line);
      padding-bottom: 14px;
    }
    .task-title {
      color: var(--text);
      font-size: 15px;
      font-weight: 500;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .badge {
      flex: 0 0 auto;
      border: 0.5px solid var(--line);
      border-radius: 999px;
      padding: 4px 9px;
      color: var(--soft);
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .badge.final_answer { color: var(--ok); border-color: rgba(140,255,140,0.28); background: rgba(140,255,140,0.06); }
    .badge.max_iterations, .badge.repair_exhausted { color: var(--warn); border-color: rgba(255,207,102,0.28); background: rgba(255,207,102,0.06); }

    .answer, .trace-entry, .error-box {
      border: 0.5px solid var(--line);
      border-radius: var(--radius);
      background: rgba(17,19,24,0.78);
      box-shadow: var(--shadow);
    }
    .answer { padding: 16px 18px; }
    .section-label {
      color: var(--muted);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      margin-bottom: 9px;
    }
    .answer-body { color: var(--text); font-size: 12.5px; overflow-wrap: anywhere; }
    .answer-body code {
      border: 0.5px solid var(--line);
      border-radius: 3px;
      padding: 1px 4px;
      background: rgba(255,255,255,0.045);
      color: var(--accent);
    }

    .trace { display: grid; gap: 10px; }
    .trace-entry { overflow: hidden; }
    .trace-top {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 12px;
      border-bottom: 0.5px solid var(--line);
      background: rgba(255,255,255,0.018);
    }
    .step {
      color: var(--accent);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .kind { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; }
    .trace-body { padding: 12px; display: grid; gap: 10px; }
    .kv { display: grid; gap: 3px; }
    .kv-label {
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    pre {
      max-width: 100%;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--soft);
      font: inherit;
      padding: 10px;
      border: 0.5px solid var(--line);
      border-radius: 4px;
      background: rgba(0,0,0,0.18);
    }

    .error-box {
      padding: 14px 16px;
      color: var(--bad);
      border-color: rgba(255,107,122,0.28);
      background: rgba(255,107,122,0.055);
    }

    .ui-panel { padding: 0; overflow: hidden; }
    .ui-frame {
      display: block;
      width: 100%;
      height: 560px;
      border: 0;
      background: var(--panel);
    }
    .ui-empty {
      padding: 16px 18px;
      color: var(--muted);
    }

    @media (max-width: 820px) {
      .shell { grid-template-columns: 1fr; }
      aside { border-right: none; border-bottom: 0.5px solid var(--line); }
      .side-section.tools { display: none; }
      .composer-inner { grid-template-columns: 1fr; }
      .podcast-select, .run-btn { width: 100%; }
      .result-head { flex-direction: column; }
    }
  </style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="brand-dot"></span><span>React Loop</span></div>
    <div class="topbar-spacer"></div>
    <a href="/ui/latest" target="_blank" rel="noopener" class="ghost">Agent's UI ↗</a>
    <button id="new-session" class="ghost">New session</button>
  </header>

  <div class="shell">
    <aside>
      <section class="side-section">
        <div class="side-head">Runs</div>
        <div id="run-list" class="run-list"></div>
      </section>
      <section class="side-section tools">
        <div class="side-head">MCP Tools</div>
        <div id="tool-list" class="tool-list"></div>
      </section>
    </aside>

    <main>
      <section class="composer">
        <div class="composer-inner">
          <div class="input-wrap">
            <textarea id="task-input" rows="2" placeholder="Ask the loop to solve a task with the configured MCP tools."></textarea>
          </div>
          <select id="podcast-select" class="podcast-select">
            <option value="">No podcast</option>
          </select>
          <button id="run-btn" class="run-btn">Run</button>
        </div>
      </section>

      <section id="workspace" class="workspace">
        <div class="empty">No run selected.</div>
      </section>
    </main>
  </div>
</div>

<script>
const state = {
  runs: [],
  selected: -1,
  loading: false,
};

const input = document.getElementById("task-input");
const podcastSelect = document.getElementById("podcast-select");
const runBtn = document.getElementById("run-btn");
const runList = document.getElementById("run-list");
const toolList = document.getElementById("tool-list");
const workspace = document.getElementById("workspace");

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function simpleMd(value) {
  let s = escapeHtml(value);
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/`(.+?)`/g, "<code>$1</code>");
  return s.replace(/\n/g, "<br>");
}

function compact(value, n = 54) {
  const s = String(value || "").replace(/\s+/g, " ").trim();
  return s.length > n ? s.slice(0, n - 1) + "..." : s;
}

function setLoading(on) {
  state.loading = on;
  runBtn.disabled = on;
  input.disabled = on;
  runBtn.textContent = on ? "Running" : "Run";
}

function renderRunList() {
  if (!state.runs.length) {
    runList.innerHTML = '<div class="tool-item"><span class="tool-desc">Runs appear here after execution.</span></div>';
    return;
  }
  runList.innerHTML = state.runs.map((run, idx) => `
    <button class="run-item ${idx === state.selected ? "active" : ""}" data-run="${idx}">
      <span class="run-title">${escapeHtml(compact(run.task))}</span>
      <span class="run-meta">${escapeHtml(run.stop_reason || "running")}</span>
    </button>
  `).join("");
  runList.querySelectorAll("[data-run]").forEach((el) => {
    el.addEventListener("click", () => {
      state.selected = Number(el.dataset.run);
      render();
    });
  });
}

function renderTools(tools, error) {
  if (error) {
    toolList.innerHTML = `<div class="tool-item"><span class="tool-name">Unavailable</span><span class="tool-desc">${escapeHtml(error)}</span></div>`;
    return;
  }
  if (!tools || !tools.length) {
    toolList.innerHTML = '<div class="tool-item"><span class="tool-desc">No tools discovered.</span></div>';
    return;
  }
  toolList.innerHTML = tools.map((tool) => `
    <div class="tool-item">
      <span class="tool-name">${escapeHtml(tool.name)}</span>
      <span class="tool-desc">${escapeHtml(tool.description || "No description.")}</span>
    </div>
  `).join("");
}

function render() {
  renderRunList();
  const run = state.runs[state.selected];
  if (!run) {
    workspace.innerHTML = '<div class="empty">No run selected.</div>';
    return;
  }
  workspace.innerHTML = `
    <div class="result">
      <div class="result-head">
        <div class="task-title">${escapeHtml(run.task)}</div>
        <div class="badge ${escapeHtml(run.stop_reason || "")}">${escapeHtml(run.stop_reason || "pending")}</div>
      </div>
      <section class="answer">
        <div class="section-label">Final Answer</div>
        <div class="answer-body">${run.final_answer ? simpleMd(run.final_answer) : escapeHtml("No final answer.")}</div>
      </section>
      <section class="answer ui-panel">
        <div class="section-label" style="padding:16px 18px 0">Generated UI</div>
        <div id="ui-panel-body"></div>
      </section>
      <section class="trace">
        <div class="section-label">Trajectory</div>
        ${(run.trajectory || []).map(renderTraceEntry).join("") || '<div class="empty">No trajectory entries.</div>'}
      </section>
    </div>
  `;
  loadGeneratedUi();
}

async function loadGeneratedUi() {
  const container = document.getElementById("ui-panel-body");
  if (!container) return;
  const src = `/ui/latest?t=${Date.now()}`;
  try {
    const res = await fetch(src);
    if (!res.ok) {
      container.innerHTML = '<div class="ui-empty">No UI generated yet — ask the agent to build one with render_ui or render_ui_from_json.</div>';
      return;
    }
    container.innerHTML = `<iframe src="${src}" class="ui-frame" title="Agent generated UI" sandbox="allow-scripts allow-same-origin"></iframe>`;
  } catch {
    container.innerHTML = '<div class="ui-empty">Could not load the generated UI.</div>';
  }
}

function renderTraceEntry(entry) {
  const body = [];
  if (entry.thought) body.push(block("Thought", entry.thought));
  if (entry.tool) body.push(block("Tool", entry.tool));
  if (entry.tool_input && Object.keys(entry.tool_input).length) {
    body.push(block("Input", JSON.stringify(entry.tool_input, null, 2)));
  }
  if (entry.observation) body.push(block("Observation", entry.observation));
  if (entry.final_answer) body.push(block("Final", entry.final_answer));
  if (entry.note) body.push(block("Note", entry.note));

  return `
    <article class="trace-entry">
      <div class="trace-top">
        <span class="step">Step ${escapeHtml(entry.step)}</span>
        <span class="kind">${escapeHtml(entry.kind)}</span>
      </div>
      <div class="trace-body">${body.join("")}</div>
    </article>
  `;
}

function block(label, value) {
  return `
    <div class="kv">
      <div class="kv-label">${escapeHtml(label)}</div>
      <pre>${escapeHtml(value)}</pre>
    </div>
  `;
}

function showError(message) {
  workspace.innerHTML = `<div class="error-box">${escapeHtml(message)}</div>`;
}

async function submitRun() {
  const rawTask = input.value.trim();
  if (!rawTask || state.loading) return;
  const podcast = podcastSelect.value;
  const task = podcast ? `Using the podcast "${podcast}": ${rawTask}` : rawTask;
  setLoading(true);
  showError("Running loop...");
  try {
    const res = await fetch("/api/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ task }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Run failed.");
    state.runs.push(data);
    state.selected = state.runs.length - 1;
    input.value = "";
    input.style.height = "auto";
    render();
  } catch (err) {
    showError(err.message || "Run failed.");
  } finally {
    setLoading(false);
    input.focus();
  }
}

async function init() {
  try {
    const res = await fetch("/api/state");
    const data = await res.json();
    state.runs = data.runs || [];
    state.selected = state.runs.length ? state.runs.length - 1 : -1;
  } catch {
    state.runs = [];
  }
  render();

  try {
    const res = await fetch("/api/tools");
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Could not list tools.");
    renderTools(data.tools || []);
  } catch (err) {
    renderTools([], err.message || "Could not list tools.");
  }

  try {
    const res = await fetch("/api/podcasts");
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Could not list podcasts.");
    const podcasts = data.podcasts || {};
    podcastSelect.innerHTML = '<option value="">No podcast</option>' + Object.keys(podcasts).map(
      (slug) => `<option value="${escapeHtml(slug)}">${escapeHtml(slug)}</option>`
    ).join("");
  } catch {
    // Curated feed list is optional — the agent can still be asked about a podcast
    // by name in free text, so leave the dropdown at its "No podcast" default.
  }
}

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 180) + "px";
});
input.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) submitRun();
});
runBtn.addEventListener("click", submitRun);

document.getElementById("new-session").addEventListener("click", async () => {
  await fetch("/api/new_session", { method: "POST" });
  state.runs = [];
  state.selected = -1;
  render();
});

init();
</script>
</body>
</html>
