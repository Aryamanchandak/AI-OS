# MIRFISH runtime configuration.
# Everything cost- or behaviour-relevant lives here; runs snapshot this file into
# their artifact so a run is reproducible from its artifact directory alone.

models:
  # Verified against the Anthropic model catalog on 2026-07-19.
  # Note: claude-sonnet-5 is now available ($3/$15 per Mtok, intro $2/$10 through
  # 2026-08-31) as a newer alternative to claude-sonnet-4-6 — swap here if desired.
  normalize: claude-haiku-4-5
  propagate: claude-sonnet-4-6
  critique: claude-sonnet-4-6

budgets:
  # Token budgets. Global cap is a hard abort (partial artifact, truncated: true).
  global_tokens: 250000
  stages:
    normalize: 5000
    propagate: 160000
    critique: 60000

gate:
  # Events below this surprise score die at the gate (a feature, not a bug).
  surprise_threshold: 0.4

propagate:
  depth_cap: 3
  beam_width: 6          # frontier nodes kept per depth
  max_proposed_edges: 5  # llm_proposed edges quarantined per run

entity_match:
  # rapidfuzz score cutoff (0-100) for fuzzy alias resolution.
  fuzzy_threshold: 88

# PLACEHOLDER PRICES — user must fill real INR-per-million-token numbers.
# Rough conversion of list USD prices at ~84 INR/USD; DO NOT trust for real cost
# accounting until replaced.
price_table_inr_per_mtok:
  claude-haiku-4-5: { input: 84, output: 420 }        # PLACEHOLDER
  claude-sonnet-4-6: { input: 252, output: 1260 }     # PLACEHOLDER
  claude-sonnet-5: { input: 252, output: 1260 }       # PLACEHOLDER (intro pricing lower)

rank:
  # Rank score = confidence_weight * depth_weight * terminal materiality weight.
  # Deliberately dumb; documented in README. No fake precision.
  confidence_weights: { high: 1.0, med: 0.7, low: 0.4 }
  depth_weights: { "1": 0.8, "2": 1.1, "3": 1.2 }   # depth 2-3 chains up-weighted
  default_materiality: 1.0
  materiality_weights:
    gsec-2y: 1.4
    gsec-5y: 1.5
    gsec-10y: 1.6
    gsec-30y: 1.4
    ois-1y: 1.3
    ois-5y: 1.3
    sdl-spread: 1.3
    inr: 1.5
    aaa-corp-spread: 1.4
    aa-spread: 1.3
    nbfc-spread: 1.4
    hfc-spread: 1.3
    india-cds-5y: 1.2
