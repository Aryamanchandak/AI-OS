edges:
  # ===== Policy rate transmission =====
  - src: rbi-mpc
    dst: repo-rate
    channel: policy
    mechanism: RBI MPC sets the repo rate at scheduled and off-cycle meetings.
    sign_hint: pos
    typical_lag: intraday
  - src: repo-rate
    dst: sdf-rate
    channel: policy
    mechanism: SDF is fixed 25bp below repo, the floor of the LAF corridor.
    sign_hint: pos
    typical_lag: intraday
  - src: repo-rate
    dst: msf-rate
    channel: policy
    mechanism: MSF is fixed 25bp above repo, the ceiling of the LAF corridor.
    sign_hint: pos
    typical_lag: intraday
  - src: repo-rate
    dst: t-bill
    channel: funding
    mechanism: T-bill yields re-price toward the new repo-anchored short rate at auction.
    sign_hint: pos
    typical_lag: days
  - src: repo-rate
    dst: ois-1y
    channel: funding
    mechanism: 1y OIS reprices near-term policy rate expectations directly.
    sign_hint: pos
    typical_lag: intraday
  - src: repo-rate
    dst: ois-5y
    channel: funding
    mechanism: 5y OIS shifts with the expected repo path, damped by term premium.
    sign_hint: pos
    typical_lag: days
  - src: repo-rate
    dst: gsec-2y
    channel: funding
    mechanism: 2y G-sec tracks the front end of the policy rate path most closely.
    sign_hint: pos
    typical_lag: days
  - src: ois-1y
    dst: gsec-2y
    channel: funding
    mechanism: The OIS curve is the primary hedging and pricing reference for short-dated G-secs.
    sign_hint: pos
    typical_lag: intraday
  - src: gsec-2y
    dst: gsec-5y
    channel: funding
    mechanism: Curve moves propagate from the front end to the belly via relative-value trading.
    sign_hint: ambiguous
    typical_lag: days
  - src: gsec-5y
    dst: gsec-10y
    channel: funding
    mechanism: Curve moves propagate from the belly to the 10y benchmark via relative-value trading.
    sign_hint: ambiguous
    typical_lag: days
  - src: gsec-10y
    dst: gsec-30y
    channel: funding
    mechanism: The long end re-prices in sympathy with the 10y benchmark, duration-adjusted.
    sign_hint: pos
    typical_lag: days
  - src: gsec-2y
    dst: term-spread-10y-2y
    channel: funding
    mechanism: The term spread is mechanically the 10y yield minus the 2y yield.
    sign_hint: ambiguous
    typical_lag: intraday
  - src: gsec-10y
    dst: term-spread-10y-2y
    channel: funding
    mechanism: The term spread is mechanically the 10y yield minus the 2y yield.
    sign_hint: ambiguous
    typical_lag: intraday
  - src: crr
    dst: laf-liquidity
    channel: liquidity
    mechanism: A CRR hike locks incremental deposits with RBI, draining banking-system liquidity.
    sign_hint: neg
    typical_lag: days
  - src: laf-liquidity
    dst: t-bill
    channel: liquidity
    mechanism: Surplus or deficit system liquidity drives banks' demand for short-duration T-bills.
    sign_hint: ambiguous
    typical_lag: days
  - src: laf-liquidity
    dst: vrrr
    channel: liquidity
    mechanism: RBI runs VRRR auctions to absorb surplus liquidity signalled by the LAF balance.
    sign_hint: ambiguous
    typical_lag: days
  - src: vrrr
    dst: gsec-2y
    channel: liquidity
    mechanism: The VRRR cut-off proxies the effective short rate and re-anchors front-end G-secs.
    sign_hint: pos
    typical_lag: days
  - src: t-bill
    dst: laf-liquidity
    channel: liquidity
    mechanism: Heavy T-bill issuance absorbs banking-system liquidity at auction settlement.
    sign_hint: neg
    typical_lag: days
    # REVIEW: direction of causality (issuance calendar vs liquidity state) is debated
  - src: laf-liquidity
    dst: nbfc-spread
    channel: liquidity
    mechanism: Tight system liquidity first squeezes wholesale-funded NBFCs via CP/NCD rollover cost.
    sign_hint: neg
    typical_lag: days
  - src: laf-liquidity
    dst: aaa-corp-spread
    channel: liquidity
    mechanism: A system liquidity deficit tightens the marginal funding cost even for top-rated corporate borrowers.
    sign_hint: neg
    typical_lag: weeks
  - src: repo-rate
    dst: nbfc-spread
    channel: funding
    mechanism: A higher policy rate raises NBFC marginal cost of funds relative to deposit-funded bank peers.
    sign_hint: neg
    typical_lag: weeks
  - src: repo-rate
    dst: hfc-spread
    channel: funding
    mechanism: Housing financiers reprice wholesale borrowing cost off the repo-anchored curve.
    sign_hint: neg
    typical_lag: weeks
  - src: repo-rate
    dst: aaa-corp-spread
    channel: funding
    mechanism: AAA paper is priced as a spread over the G-sec curve, which itself resets with policy rate moves.
    sign_hint: neg
    typical_lag: weeks
  - src: aaa-corp-spread
    dst: aa-spread
    channel: funding
    mechanism: AA spreads move with the AAA curve plus an idiosyncratic quality premium that widens faster in stress.
    sign_hint: ambiguous
    typical_lag: weeks
  - src: gsec-10y
    dst: sdl-spread
    channel: funding
    mechanism: State development loan yields are quoted as a spread over the matched-maturity G-sec benchmark.
    sign_hint: ambiguous
    typical_lag: weeks
  - src: gsec-10y
    dst: aaa-corp-spread
    channel: funding
    mechanism: AAA corporate bonds are priced as a spread over the risk-free G-sec curve.
    sign_hint: ambiguous
    typical_lag: days
  - src: gsec-10y
    dst: hfc-spread
    channel: funding
    mechanism: Housing financiers' wholesale bond funding is priced as a spread over the G-sec curve.
    sign_hint: ambiguous
    typical_lag: weeks
  - src: repo-rate
    dst: psu-bank-credit
    channel: funding
    mechanism: External-benchmark-linked (EBLR) loan books reprice with the repo rate on a quarterly reset.
    sign_hint: pos
    typical_lag: months
  - src: repo-rate
    dst: private-bank-credit
    channel: funding
    mechanism: External-benchmark-linked loan books reprice with the repo rate on a quarterly reset.
    sign_hint: pos
    typical_lag: months
  - src: repo-rate
    dst: bank-nim
    channel: funding
    mechanism: NIM direction depends on whether faster EBLR-linked loan repricing outpaces slower deposit repricing.
    sign_hint: ambiguous
    typical_lag: months
    # REVIEW: NIM sensitivity to rate direction varies significantly by bank funding mix
  - src: bank-nim
    dst: psu-bank-credit
    channel: funding
    mechanism: NIM compression pressures bank profitability and willingness to extend fresh credit at the margin.
    sign_hint: ambiguous
    typical_lag: months
    # REVIEW: weak, indirect link — flagged for user judgement
  - src: bank-nim
    dst: private-bank-credit
    channel: funding
    mechanism: NIM compression pressures bank profitability and willingness to extend fresh credit at the margin.
    sign_hint: ambiguous
    typical_lag: months
    # REVIEW: weak, indirect link — flagged for user judgement

  # ===== Inflation transmission =====
  - src: crude-brent
    dst: cpi
    channel: inflation
    mechanism: Fuel and transport components of CPI reprice with a lag to crude oil moves.
    sign_hint: pos
    typical_lag: weeks
  - src: crude-brent
    dst: wpi
    channel: inflation
    mechanism: The WPI fuel and power group tracks crude and refined product prices closely and quickly.
    sign_hint: pos
    typical_lag: days
  - src: food-prices
    dst: cpi
    channel: inflation
    mechanism: Food and beverages carry the largest single weight in India's CPI basket.
    sign_hint: pos
    typical_lag: weeks
  - src: monsoon
    dst: food-prices
    channel: supply_chain
    mechanism: Deficient or excess rainfall drives kharif crop output and hence food supply and prices.
    sign_hint: ambiguous
    typical_lag: months
  - src: monsoon
    dst: cpi
    channel: inflation
    mechanism: A poor monsoon's food-price effect is large enough to move headline CPI directly.
    sign_hint: pos
    typical_lag: months
    # REVIEW: partially redundant with monsoon -> food-prices -> cpi; kept as a distinct faster channel
  - src: wpi
    dst: cpi
    channel: inflation
    mechanism: Producer price pressure passes through to consumer prices with a lag as input costs are passed on.
    sign_hint: pos
    typical_lag: months
  - src: cpi
    dst: core-cpi
    channel: inflation
    mechanism: Core CPI is CPI ex food and fuel; headline food/fuel prints are reported alongside but not directly causal.
    sign_hint: ambiguous
    typical_lag: intraday
    # REVIEW: this edge mostly captures reporting co-occurrence, not a real economic mechanism
  - src: cpi
    dst: rbi-mpc
    channel: policy
    mechanism: CPI prints materially above or below the 4% +/- 2% target shift the MPC's rate decision.
    sign_hint: ambiguous
    typical_lag: weeks
  - src: core-cpi
    dst: rbi-mpc
    channel: policy
    mechanism: Sticky core inflation is the MPC's primary read on underlying demand-side price pressure.
    sign_hint: pos
    typical_lag: weeks
  - src: core-cpi
    dst: ois-5y
    channel: inflation
    mechanism: Sticky core inflation raises the market's medium-term policy rate expectations priced into the OIS curve.
    sign_hint: pos
    typical_lag: weeks
  - src: core-cpi
    dst: aaa-corp-spread
    channel: inflation
    mechanism: Persistent core inflation raises real funding costs across the credit curve, not only the sovereign curve.
    sign_hint: pos
    typical_lag: weeks
    # REVIEW: indirect; effect is usually dominated by the sovereign-curve channel already captured elsewhere
  - src: omcs
    dst: cpi
    channel: inflation
    mechanism: OMC retail fuel pricing decisions are a direct, high-weight pass-through into the CPI fuel sub-index.
    sign_hint: pos
    typical_lag: days
  - src: inr
    dst: cpi
    channel: inflation
    mechanism: INR depreciation raises the landed cost of imported crude, edible oil, and other dollar-priced inputs.
    sign_hint: pos
    typical_lag: weeks

  # ===== Fiscal =====
  - src: crude-brent
    dst: fiscal-deficit-gdp
    channel: policy
    mechanism: Elevated crude raises the OMC/fertiliser subsidy bill, widening the fiscal deficit.
    sign_hint: neg
    typical_lag: months
  - src: fiscal-deficit-gdp
    dst: gsec-10y
    channel: policy
    mechanism: A wider fiscal deficit raises the government's gross borrowing programme, pressuring G-sec yields.
    sign_hint: pos
    typical_lag: weeks
  - src: goi-fiscal
    dst: fiscal-deficit-gdp
    channel: policy
    mechanism: The Union Budget sets the government's revenue and expenditure plan and hence the deficit path.
    sign_hint: ambiguous
    typical_lag: intraday
  - src: goi-fiscal
    dst: gsec-10y
    channel: policy
    mechanism: The Budget's gross and net borrowing calendar is the single biggest annual G-sec supply signal.
    sign_hint: ambiguous
    typical_lag: days
  - src: goi-fiscal
    dst: sdl-spread
    channel: policy
    mechanism: State borrowing calendars are coordinated with the Union Budget's overall market borrowing plan.
    sign_hint: ambiguous
    typical_lag: weeks
    # REVIEW: coordination is loose in practice; states retain independent borrowing autonomy
  - src: fiscal-deficit-gdp
    dst: sdl-spread
    channel: policy
    mechanism: Aggregate centre-plus-state government borrowing supply pressure widens SDL spreads over G-secs.
    sign_hint: pos
    typical_lag: weeks
  - src: omcs
    dst: fiscal-deficit-gdp
    channel: policy
    mechanism: GoI compensates OMCs for under-recoveries via subsidy payouts when retail prices are held down.
    sign_hint: neg
    typical_lag: months
  - src: fiscal-deficit-gdp
    dst: india-sovereign-rating
    channel: risk_sentiment
    mechanism: Persistent fiscal slippage versus the consolidation glide path is a primary input to rating agency reviews.
    sign_hint: neg
    typical_lag: months
  - src: current-account-deficit
    dst: india-sovereign-rating
    channel: risk_sentiment
    mechanism: External vulnerability (CAD, reserve cover) is assessed by rating agencies alongside fiscal metrics.
    sign_hint: neg
    typical_lag: months
  - src: forex-reserves
    dst: india-sovereign-rating
    channel: risk_sentiment
    mechanism: Reserve adequacy (import cover) is a standard external-vulnerability input to sovereign rating reviews.
    sign_hint: pos
    typical_lag: months
    # REVIEW: one of several inputs; weighting versus fiscal/growth metrics varies by agency
  - src: india-sovereign-rating
    dst: fpi-debt-flows
    channel: flows
    mechanism: A rating action changes India's eligibility and weight in global sovereign bond indices and mandates.
    sign_hint: pos
    typical_lag: months
  - src: india-sovereign-rating
    dst: gsec-10y
    channel: risk_sentiment
    mechanism: A sovereign rating change re-prices the risk-free curve's credit-risk premium directly.
    sign_hint: neg
    typical_lag: weeks
  - src: india-sovereign
    dst: global-risk-sentiment
    channel: risk_sentiment
    mechanism: Geopolitical or security incidents involving India are read by global investors as a country risk-premium event.
    sign_hint: neg
    typical_lag: days
    # REVIEW: magnitude highly event-specific; kept generic pending a concrete fixture

  # ===== US rates / dollar / global =====
  - src: fed
    dst: fed-funds-rate
    channel: policy
    mechanism: The FOMC sets the federal funds rate at scheduled meetings.
    sign_hint: pos
    typical_lag: intraday
  - src: us-2y
    dst: fed-funds-rate
    channel: funding
    mechanism: 2y UST is the market's primary pricing vehicle for the near-term Fed path.
    sign_hint: pos
    typical_lag: intraday
    # REVIEW: causality runs both ways in practice (market pricing also informs Fed reaction function)
  - src: us-2y
    dst: us-10y
    channel: funding
    mechanism: The long end re-prices in sympathy with front-end rate expectations, curve-shape dependent.
    sign_hint: ambiguous
    typical_lag: days
  - src: fed-funds-rate
    dst: us-10y
    channel: funding
    mechanism: The US 10y Treasury yield reprices with the expected Fed policy path.
    sign_hint: pos
    typical_lag: days
  - src: fed-funds-rate
    dst: dxy
    channel: fx
    mechanism: A hawkish or dovish Fed shifts US rate differentials and hence dollar demand.
    sign_hint: pos
    typical_lag: days
  - src: us-10y
    dst: dxy
    channel: fx
    mechanism: Rising US real yields attract capital into dollar assets, supporting the dollar index.
    sign_hint: pos
    typical_lag: days
  - src: dxy
    dst: inr
    channel: fx
    mechanism: A stronger dollar mechanically weighs on INR and most EM currencies via the DXY basket.
