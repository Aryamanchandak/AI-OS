# MIRFISH seed entity graph — India macro/rates/credit/FX/sector transmission map.
#
# This is a Claude-drafted FIRST PASS. It is the domain-leverage point of the
# whole system and MUST be reviewed by the user before Milestone M3 (propagation)
# begins. Edges flagged "# REVIEW" are the ones most likely to be wrong,
# contested among practitioners, or oversimplified — look at those first.
#
# Every edge has: src, dst, channel, mechanism (one sentence, named), sign_hint,
# typical_lag. `provenance` defaults to "curated" and is omitted below — LLM-
# proposed edges discovered at runtime are quarantined separately and never
# written here automatically (see mirfish graph review-proposed).
#
# node types: issuer | sector | commodity | currency | sovereign | policy_inst
#             | rate_instrument | macro_var | flow
# edge channels: policy | inflation | funding | fx | trade | supply_chain
#                | risk_sentiment | liquidity | flows
# sign_hint: pos | neg | ambiguous   typical_lag: intraday | days | weeks | months

