[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "consequence-radar"
version = "0.1.0"
description = "Bounded causal research for Indian equities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.115",
  "google-genai>=1.0",
  "httpx>=0.27",
  "jinja2>=3.1",
  "networkx>=3.2",
  "pydantic-settings>=2.5",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "trafilatura>=1.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27"]

[project.scripts]
consequence-radar = "consequence_radar.web.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/consequence_radar"]
exclude = ["**/test_*.py"]

[tool.pytest.ini_options]
testpaths = ["src/consequence_radar", "tests"]
pythonpath = ["src"]
addopts = "-q"

