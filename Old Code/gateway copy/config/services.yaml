# Gateway port 8000 is a deliberate stable entry point. The legacy listener
# on 8111 is optional compatibility for callers that still use the old port.
# New AI OS-owned external workers use a free port in the reserved 81xx range.
services:
  gateway:
    host: 127.0.0.1
    port: 8000
    enabled: true
    required: true
  glc_legacy:
    host: 127.0.0.1
    port: 8111
    enabled: true
    required: false
  agent_runtime:
    host: 127.0.0.1
    port: 8113
    enabled: true
    required: false
  telegram_worker:
    host: 127.0.0.1
    port: 8121
    enabled: false
    required: false

# Optional-worker policy: Gateway validates optional worker configuration but
# does not probe it during startup. An unavailable optional worker must degrade
# only its owning feature; required configuration still fails startup eagerly.
