[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vector_db"
version = "0.1.0"
description = "Vector similarity store (ChromaDB-backed) split out of study_system"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.4.0",
    "ollama>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "mypy>=1.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
