<svg width="100%" viewBox="0 0 680 470" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, system-ui, sans-serif">
<style>
.t{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;font-weight:400;fill:#5F5E5A}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.gray{fill:#F1EFE8;stroke:#888780}
.blue{fill:#E6F1FB;stroke:#378ADD}
.purple{fill:#EEEDFE;stroke:#7F77DD}
.coral{fill:#FAECE7;stroke:#D85A30}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
rect{stroke-width:0.5}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<text class="th" x="40" y="28">Vertical apps (separate repos)</text>
<rect class="gray" x="42" y="40" width="90" height="46" rx="6"/><text class="t" x="87" y="62" text-anchor="middle">Planner</text><text class="ts" x="87" y="77" text-anchor="middle">cal / rem</text>
<rect class="gray" x="142" y="40" width="90" height="46" rx="6"/><text class="t" x="187" y="62" text-anchor="middle">UPI</text><text class="ts" x="187" y="77" text-anchor="middle">ledger</text>
<rect class="gray" x="242" y="40" width="90" height="46" rx="6"/><text class="t" x="287" y="62" text-anchor="middle">Podcast</text><text class="ts" x="287" y="77" text-anchor="middle">brief</text>
<rect class="gray" x="342" y="40" width="90" height="46" rx="6"/><text class="t" x="387" y="62" text-anchor="middle">Study</text><text class="ts" x="387" y="77" text-anchor="middle">cards / KG</text>
<rect class="blue" x="442" y="40" width="90" height="46" rx="6"/><text class="t" x="487" y="62" text-anchor="middle">Sharpen</text><text class="ts" x="487" y="77" text-anchor="middle">browser</text>
<rect class="blue" x="542" y="40" width="90" height="46" rx="6"/><text class="t" x="587" y="62" text-anchor="middle">Optimizer</text><text class="ts" x="587" y="77" text-anchor="middle">prompt / dx</text>

<line class="arr" x1="200" y1="86" x2="220" y2="120" marker-end="url(#arrow)"/>
<line class="arr" x1="400" y1="86" x2="400" y2="120" marker-end="url(#arrow)"/>
<line class="arr" x1="540" y1="86" x2="470" y2="120" marker-end="url(#arrow)"/>

<rect class="purple" x="60" y="122" width="560" height="50" rx="8"/><text class="th" x="340" y="143" text-anchor="middle">Research / aggregator service — standalone (MCP + Python client)</text><text class="ts" x="340" y="161" text-anchor="middle">triage · fetch · dedup · synthesize · citation-gate</text>

<line class="arr" x1="340" y1="172" x2="340" y2="194" marker-end="url(#arrow)"/>

<rect class="purple" x="60" y="196" width="560" height="56" rx="8"/><text class="th" x="340" y="220" text-anchor="middle">aios-memory — shared knowledge + memory substrate</text><text class="ts" x="340" y="239" text-anchor="middle">Obsidian vault · SQLite · ChromaDB · NetworkX KG · one entity namespace</text>

<line class="arr" x1="160" y1="252" x2="160" y2="284" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="252" x2="340" y2="284" marker-end="url(#arrow)"/>
<line class="arr" x1="520" y1="252" x2="520" y2="284" marker-end="url(#arrow)"/>

<text class="th" x="40" y="278">Foundation packages</text>
<rect class="coral" x="40" y="286" width="138" height="54" rx="6"/><text class="t" x="109" y="308" text-anchor="middle">aios-gateway</text><text class="ts" x="109" y="324" text-anchor="middle">LLM + 1 meter + budget</text>
<rect class="coral" x="194" y="286" width="138" height="54" rx="6"/><text class="t" x="263" y="308" text-anchor="middle">aios-contracts</text><text class="ts" x="263" y="324" text-anchor="middle">Entity · Claim · Source</text>
<rect class="coral" x="348" y="286" width="138" height="54" rx="6"/><text class="t" x="417" y="308" text-anchor="middle">aios-macos</text><text class="ts" x="417" y="324" text-anchor="middle">calendar + agent loop</text>
<rect class="coral" x="502" y="286" width="138" height="54" rx="6"/><text class="t" x="571" y="308" text-anchor="middle">MCP surface</text><text class="ts" x="571" y="324" text-anchor="middle">agents + JS apps</text>

<rect class="gray" x="210" y="370" width="260" height="42" rx="6" stroke-dasharray="5 4"/><text class="t" x="340" y="389" text-anchor="middle">Painting_shapes — excluded</text><text class="ts" x="340" y="405" text-anchor="middle">no shared substrate (screen-draw toy)</text>

<rect class="gray" x="40" y="432" width="12" height="12" rx="3"/><text class="ts" x="58" y="442">app</text>
<rect class="blue" x="110" y="432" width="12" height="12" rx="3"/><text class="ts" x="128" y="442">JS app (via MCP / HTTP)</text>
<rect class="purple" x="320" y="432" width="12" height="12" rx="3"/><text class="ts" x="338" y="442">core shared service</text>
<rect class="coral" x="490" y="432" width="12" height="12" rx="3"/><text class="ts" x="508" y="442">foundation package</text>
</svg>
