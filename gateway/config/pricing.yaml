# USD per million tokens, standard API pricing. Checked 2026-10-18.
# Add an exact model entry here when adding a model to profiles.yaml or changing
# OPENAI_MODEL / ANTHROPIC_MODEL. Unknown models are explicitly unpriced.
# Sources:
# https://platform.claude.com/docs/en/about-claude/pricing
# https://developers.openai.com/api/docs/models/gpt-5.4-nano
# https://developers.openai.com/api/docs/models/gpt-5.4-mini
# https://developers.openai.com/api/docs/models/gpt-5.5
# Claude cache writes use the 5-minute TTL rate; reads cost 10% of base input.
# These are base rates; premium processing modes and long-context surcharges
# are not represented by this flat per-model table.
version: 1

defaults:
  currency: USD
  unit: usd_per_mtok
  cache_read_multiplier: 1.0
  cache_write_multiplier: 1.0

unpriced_default:
  input: 0.0
  output: 0.0

models:
  claude-haiku-4-5:
    provider: anthropic
    input: 1.00
    output: 5.00
    cache_read_multiplier: 0.1
    cache_write_multiplier: 1.25
    quality: 0.50
  claude-sonnet-4-6:
    provider: anthropic
    input: 3.00
    output: 15.00
    cache_read_multiplier: 0.1
    cache_write_multiplier: 1.25
    quality: 0.57
  claude-opus-4-8:
    provider: anthropic
    input: 5.00
    output: 25.00
    cache_read_multiplier: 0.1
    cache_write_multiplier: 1.25
    quality: 0.61
  gpt-5.4-nano:
    provider: openai
    input: 0.20
    output: 1.25
    cache_read_multiplier: 0.1
    quality: 0.40
  gpt-5.4-mini:
    provider: openai
    input: 0.75
    output: 4.50
    cache_read_multiplier: 0.1
    quality: 0.50
  gpt-5.5:
    provider: openai
    input: 5.00
    output: 30.00
    cache_read_multiplier: 0.1
    quality: 0.59

  # Local inference has no API token charge; explicit entries distinguish it
  # from missing prices. Covers all local defaults and embedding/chat profiles.
  gemma4:31b:
    provider: ollama
    input: 0.0
    output: 0.0
  gemma4:12b:
    provider: ollama
    input: 0.0
    output: 0.0
  phi4:14b-q4_K_M:
    provider: ollama
    input: 0.0
    output: 0.0
  nomic-embed-text:
    provider: ollama
    input: 0.0
    output: 0.0
