# Spend budgets for agent and session attribution.
# A call reserves its estimated input cost plus max_tokens at the output rate.
# Every matching dimension must have room; a breach returns HTTP 402.
# Actual costs replace reservations in SQLite, so spend survives restarts.
# No policies are enabled until you add one here or POST /api/llm/budget.
version: 1

defaults:
  enabled: true
  period: day # minute | hour | day | month | lifetime
  currency: USD
  include_errors: true

# Exact values beat globs within each dimension. With agent:* or session:*,
# each matching value has its own ceiling rather than sharing a pooled limit.
# Example:
# policies:
#   - principal: "agent:summarizer"
#     limit_usd: 0.25
#     period: hour
#   - principal: "session:*"
#     limit_usd: 0.50
#     period: lifetime
policies: []
