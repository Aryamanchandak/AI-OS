[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-os-gateway"
version = "0.2.0"
description = "Typed application container and HTTP gateway for AI OS"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = ["mypy>=1.8", "pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["."]
pythonpath = ["src", "."]
norecursedirs = [".venv", "build"]
addopts = "-m 'not golden'"
markers = ["golden: real paid requests using keys from .env; run with -m golden"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
mypy_path = "src"
cache_dir = "/tmp/ai-os-gateway-mypy-cache"
exclude = ["/tests?/", "/test\\.py$", "test_.*\\.py$"]
