[mypy]
python_version = 3.11
strict = True
ignore_missing_imports = True
mypy_path = src,../ingestion-pipeline/merged-ingestion/src,../ingestion-pipeline/merged-ingestion
cache_dir = /tmp/ai-os-gateway-mypy-cache
exclude = (?x)(/tests?/|/test\.py$|test_.*\.py$)

[mypy-cockpit.*]
follow_imports = skip

[mypy-ingestion.*]
follow_imports = skip

[mypy-preview]
follow_imports = skip

[mypy-gateway.channels.catalogue.*]
follow_imports = skip
ignore_errors = True

[mypy-gateway.voice.stt.providers.*]
follow_imports = skip
ignore_errors = True

[mypy-gateway.voice.tts.providers.*]
follow_imports = skip
ignore_errors = True
