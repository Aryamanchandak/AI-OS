[mypy]
python_version = 3.12
strict = True
ignore_missing_imports = True
mypy_path = src
cache_dir = /tmp/ai-os-gateway-mypy-cache
exclude = (?x)(/tests?/|/test\.py$|test_.*\.py$)

[mypy-gateway.channels.catalogue.*]
follow_imports = skip
ignore_errors = True

[mypy-gateway.voice.stt.providers.*]
follow_imports = skip
ignore_errors = True

[mypy-gateway.voice.tts.providers.*]
follow_imports = skip
ignore_errors = True
