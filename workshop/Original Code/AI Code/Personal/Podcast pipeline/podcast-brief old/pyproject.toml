[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-brief"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2024.1.0",
    "deepgram-sdk>=3.0.0",
    "anthropic>=0.40.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "feedparser>=6.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "markdown>=3.5.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.0.0",
    "tenacity>=8.0.0",
    "mcp>=1.0.0",
]

[project.scripts]
podcast-brief = "interface.cli:main"
podcast-brief-mcp = "interface.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
