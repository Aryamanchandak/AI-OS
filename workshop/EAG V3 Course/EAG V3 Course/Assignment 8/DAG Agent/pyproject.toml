[project]
name = "assignment8-comparison-agent"
version = "0.1.0"
description = "Evidence-based comparisons executed as a resumable DAG"
requires-python = ">=3.11,<3.12"
dependencies = ["anthropic==0.125.0", "PyYAML==6.0.3", "matplotlib==3.9.4"]

[dependency-groups]
