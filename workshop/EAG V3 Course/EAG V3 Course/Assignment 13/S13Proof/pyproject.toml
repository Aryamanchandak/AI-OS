[project]
name = "eagv3-s13proof"
version = "0.1.0"
description = "Reproducible proof harness for S13Code"
requires-python = ">=3.11"
dependencies = ["eagv3-s13code", "httpx>=0.27", "grpcio>=1.70", "a2a-sdk[grpc]>=1.0,<2"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.uv.sources]
eagv3-s13code = { path = "../S13Code", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["s13proof"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["s13proof"]
