<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Local shoe comparison test</title>
<style>
*{box-sizing:border-box} :root{--bg:#f7f3e9;--ink:#25281e;--accent:#465d2c;--line:#d4d4c3;--space:24px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Tahoma,Geneva,sans-serif}
main{max-width:1100px;margin:auto;padding:48px var(--space)}
h1{font:clamp(36px,5vw,64px)/1.1 Georgia,serif;letter-spacing:-.03em;margin:20px 0}
h2{font:28px Georgia,serif} .notice{font-weight:bold;letter-spacing:.06em;border-bottom:2px solid var(--ink);padding-bottom:16px}
.controls{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:24px}
article{padding:24px;border:1px solid var(--line);background:white;border-radius:8px}
button,input{font:inherit;border:1px solid var(--accent);border-radius:4px;padding:10px 16px;max-width:100%}
button{background:var(--accent);color:white;cursor:pointer;transition:background .15s}
button:hover{background:var(--ink)}button:focus-visible,input:focus-visible{outline:3px solid #b58010;outline-offset:3px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.5 monospace;border-top:1px solid var(--line);padding-top:16px}
[hidden]{display:none} .muted{color:#585e4d} @media(max-width:480px){main{padding:24px 16px}}
</style></head><body><main>
<p class="notice">DRY RUN · FICTIONAL SHOP AND PRODUCTS · NO PURCHASES</p>
<h1 id="shop"></h1><p class="muted">Local browser test for a beginner moving from treadmill to road running.</p>
<div class="controls"><button onclick="filtered=true;render()">Filter men's road shoes</button>
<button onclick="selected=true;render()">Select UK 11</button></div>
<p id="state"></p><section id="catalog" class="products"></section>
<article id="detail" hidden><h2 id="model"></h2><p id="variant"></p>
<div id="deliveryControls"><label for="postcode">Delivery postcode</label>
<input id="postcode" type="password" inputmode="numeric" aria-label="Delivery postcode"
oninput="document.getElementById('entry').textContent='POSTCODE: entered'">
<p id="entry">POSTCODE: empty</p><button onclick="checked=true;valid=document.getElementById('postcode').value===profile.delivery.postcode;render()">Check delivery</button></div>
<p id="delivery"></p><pre id="evidence"></pre><button id="next" onclick="index++;checked=false;valid=false;render()">Next product</button>
</article></main><script>
const products=__PRODUCTS__, profile=__PROFILE__;
let filtered=false,selected=false,index=-1,checked=false,valid=false;
function openProduct(i){index=i;checked=false;valid=false;location.hash='product-'+i;render()}
function render(){
document.getElementById('shop').textContent=products[0].retailer;
document.getElementById('state').textContent=(filtered?'FILTER: men / road':'FILTER: not set')+' | '+(selected?'SIZE: UK 11':'SIZE: not set')+' | '+(index<0?'DETAIL: none':'DETAIL: open');
const catalog=document.getElementById('catalog');catalog.hidden=!(filtered&&selected)||index>=0;catalog.replaceChildren();
products.forEach((p,i)=>{const card=document.createElement('article'),h=document.createElement('h2'),b=document.createElement('button');h.textContent=p.model;b.textContent='Open '+p.model;b.onclick=()=>openProduct(i);card.append(h,b);catalog.append(card)});
document.getElementById('detail').hidden=index<0;if(index<0)return;
location.hash='product-'+index;const p=products[index];
document.getElementById('model').textContent=p.model;
document.getElementById('variant').textContent='Requested UK 11; available variant '+p.size_system+' '+p.size+'; displayed price '+p.currency+' '+p.price+'; road running';
document.getElementById('deliveryControls').hidden=checked;
if(!checked){document.getElementById('postcode').value='';document.getElementById('entry').textContent='POSTCODE: empty'}
document.getElementById('delivery').textContent=checked?'DELIVERY: checked':'DELIVERY: unchecked';
document.getElementById('evidence').textContent=checked?'OBSERVED_PRODUCT '+JSON.stringify({...p,delivery:valid?p.delivery:null,source_url:location.href}):'';
document.getElementById('next').hidden=!checked||index>=products.length-1;
}render();
</script></body></html>
