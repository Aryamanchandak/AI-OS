[project]
name = "a06-agent-loop"
version = "0.1.0"
description = "EAG V3 Session 6: a four-layer agent (memory, perception, decision, action) over an MCP tool server and the LLM gateway."
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]<2",
    "httpx",
    "ddgs",
    "tavily-python",
    "crawl4ai",
    "python-dotenv",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "network: needs internet access",
    "live: makes real (paid) model calls through the gateway",
]
addopts = "-m 'not live and not network'"
