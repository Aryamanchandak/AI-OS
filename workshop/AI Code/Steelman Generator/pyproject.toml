[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "steelman-generator"
version = "0.1.0"
description = "Evidence-aware steelman reconstruction for claims and forensic-accounting flags"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40",
  "pydantic>=2.7",
  "streamlit>=1.37",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]
neo4j = ["neo4j>=5.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/steelman"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
