[project]
name = "ai-os"
version = "0.1.0"
description = "AI OS: core (trunk) and leaves (agents). The gateway, ingestion and shell are separate projects in their own folders."
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "golden: real requests with known answers; needs the gateway running",
    "eval: model-graded cases; costs money, never in the offline run",
]
