[project]
name = "decision-tracker"
version = "0.1.0"
description = "A local, append-only decision journal with integrity and scoring"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8,<3",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.40,<2", "pandas>=2.2,<3", "plotly>=5.24,<7"]
mcp = ["fastmcp>=2,<4"]
voice = ["faster-whisper>=1.1,<2"]
all = [
    "streamlit>=1.40,<2", "pandas>=2.2,<3", "plotly>=5.24,<7",
    "fastmcp>=2,<4",
    "faster-whisper>=1.1,<2",
]

[project.scripts]
dt = "decision_tracker.cli:app"
decision-tracker-mcp = "decision_tracker.mcp_server:main"


[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
