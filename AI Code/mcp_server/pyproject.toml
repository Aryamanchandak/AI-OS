[project]
name = "icici-prudential-mcp-server"
version = "0.1.0"
description = "MCP server for ICICI Prudential agent tools."
requires-python = ">=3.11"
dependencies = [
    "crawl4ai",
    "ddgs==9.14.4",
    "faiss-cpu==1.14.3",
    "feedparser==6.0.12",
    "google-genai==2.10.0",
    "googlenewsdecoder==0.1.7",
    "httpx==0.28.1",
    "knowledge_graph",
    "mcp[cli]==1.28.0",
    "numpy==2.4.6",
    "openpyxl==3.1.5",
    "pillow==12.2.0",
    "pydantic==2.13.4",
    "python-docx==1.2.0",
    "pytubefix==10.10.1",
    "yt-dlp==2026.6.9",
    "vector_db",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.uv.sources]
knowledge_graph = { path = "../Database/knowledge-graph", editable = true }
vector_db = { path = "../Database/vector-db", editable = true }
