<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI OS plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="app-css">
.sgraph{display:block}
.sgnode rect{fill:var(--sheet);stroke:var(--rule);stroke-width:1.5}
.sgnode.planned rect{stroke:var(--built);stroke-width:2.5}
.sgnode.seeded rect{stroke:var(--specced);stroke-width:2.5}
.sgnode.empty rect{stroke:var(--idea);stroke-dasharray:4 3;stroke-width:2}
.sgnode text{fill:var(--ink);font-size:12px}
.sgnode{cursor:pointer}
.sgedge{stroke:var(--plateEdge);stroke-width:1.5;fill:none}
.stagecard{border:1px solid var(--rule);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--sheet)}
.stagecard h4{margin:0 0 4px;font-size:1rem}
.pstate{font-size:.75rem;font-weight:700;border-radius:999px;padding:2px 8px;margin-left:6px}
.pstate.planned{background:var(--built);color:#fff}.pstate.seeded{background:var(--specced);color:#fff}.pstate.empty{background:var(--idea);color:#fff}
.planbox{white-space:pre-wrap;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:10px;font-size:.9rem}
#seedTa{width:100%;min-height:90px;padding:8px;border:1px solid var(--rule);border-radius:8px;background:var(--paper)}
:root{
  --paper:#E9EDF2;--sheet:#F7F9FB;--ink:#16243A;--ink2:#56637A;--rule:#C7CFDA;--plate:#D6DDE7;--plateEdge:#AEB9C8;
  --built:#17766A;--rough:#5E8F3A;--specced:#3651C9;--idea:#B07012;--shelf:#8A94A5;--retired:#A23B3B;
  --pink:#B02A6E;--glow:#FFD15C;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111925;--sheet:#192333;--ink:#E6EBF2;--ink2:#A3AFC2;--rule:#33405A;--plate:#24314A;--plateEdge:#3A4A66;
  --built:#4CC2B1;--rough:#9BCB6E;--specced:#8EA2FF;--idea:#F0B45A;--shelf:#7E899B;--retired:#FF8A8A;--pink:#FF7AB8;--glow:#FFD15C;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111925;--sheet:#192333;--ink:#E6EBF2;--ink2:#A3AFC2;--rule:#33405A;--plate:#24314A;--plateEdge:#3A4A66;
  --built:#4CC2B1;--rough:#9BCB6E;--specced:#8EA2FF;--idea:#F0B45A;--shelf:#7E899B;--retired:#FF8A8A;--pink:#FF7AB8;--glow:#FFD15C;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--specced);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{padding:24px 0 4px}
h1{font-size:clamp(2.1rem,6vw,3.4rem);line-height:1;margin:0;font-weight:800;letter-spacing:-.035em}
.lede{max-width:64ch;color:var(--ink2);margin:10px 0 0}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule);margin-top:14px}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{flex:none;padding:13px 12px 11px;text-decoration:none;color:var(--ink2);font-weight:600;border-bottom:3px solid transparent}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
section.view{display:none;padding:18px 0 90px}
section.view.on{display:block}
h2{font-size:1.45rem;margin:0 0 6px;letter-spacing:-.015em}
h3{font-size:1.06rem;margin:0 0 4px}
p{max-width:70ch}
.muted{color:var(--ink2)}
.small{font-size:.86rem}
.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:.9rem}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.45;cursor:default}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.toolbar .sp{flex:1}
.status{font-size:.86rem;color:var(--ink2)}
.status.dirty{color:var(--pink);font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

/* approach strip */
.principles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);margin:6px 0 18px}
.principles div{padding:10px 14px 12px 0}
.principles b{display:block;font-size:.95rem}
.principles span{font-size:.86rem;color:var(--ink2)}

/* stack */
.stackwrap{position:relative;background:linear-gradient(180deg,var(--sheet),var(--paper));border:1px solid var(--rule);border-radius:18px;overflow:auto;-webkit-overflow-scrolling:touch}
svg#stack{display:block;margin:0 auto}
svg text{font-family:"Schibsted Grotesk",system-ui,sans-serif}
.pl-top{fill:var(--plate);stroke:var(--plateEdge)}
.pl-front{fill:var(--plateEdge)}
.pl-shadow{fill:var(--ink);opacity:.07}
.pl.shelf .pl-shadow{opacity:0}
.pl.shelf .pl-top{fill:none;stroke-dasharray:5 5}
.pl.shelf .pl-front{fill:none}
.pl-num{fill:var(--ink);font-size:30px;font-weight:800;letter-spacing:-.03em}
.pl-t{fill:var(--ink);font-size:15px;font-weight:700}
.pl-s{fill:var(--ink2);font-size:12px}
.pl{cursor:pointer}
.blk{cursor:pointer;transition:opacity .15s}
.blk .f{fill:var(--c)}
.blk .tp{fill:var(--c);opacity:.62}
.blk .sd{fill:var(--c);filter:brightness(.72)}
.blk .ol{fill:none;stroke:var(--glow);stroke-width:3;opacity:0}
.blk.sel .ol,.blk.rel .ol{opacity:1}
.blk.rel .ol{stroke-dasharray:4 3}
.blk.dim{opacity:.18}
.cap{fill:var(--ink);font-size:12.5px;font-weight:700;paint-order:stroke;stroke:var(--sheet);stroke-width:4px;pointer-events:none}
.legendrow{display:flex;flex-wrap:wrap;gap:14px;font-size:.84rem;color:var(--ink2);margin:10px 2px 0}
.legendrow span{display:inline-flex;align-items:center;gap:6px}
.heights{display:inline-flex;align-items:flex-end;gap:3px}
.heights i{display:block;width:8px;background:var(--ink2);border-radius:1px}

/* tiers */
.tier{margin-top:34px;display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:900px){.tier{grid-template-columns:280px 1fr;gap:28px}}
.tier-head .num{font-size:3.4rem;font-weight:800;line-height:.9;letter-spacing:-.05em}
.tier-head h3{font-size:1.35rem;margin:6px 0 6px;letter-spacing:-.01em}
.tier-head p{margin:0 0 8px;font-size:.95rem}
.done{border-left:3px solid var(--ink);padding:4px 0 4px 10px;font-size:.88rem}
.rows{border-top:1px solid var(--rule)}
.row{display:grid;grid-template-columns:14px 1fr;gap:4px 12px;padding:12px 6px;border-bottom:1px solid var(--rule);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.row:hover{background:var(--sheet)}
.row.sel{background:var(--sheet);box-shadow:inset 3px 0 0 var(--glow)}
.row.rel{box-shadow:inset 3px 0 0 var(--glow)}
.row .bar{grid-row:1/4;width:6px;border-radius:3px;background:var(--c);align-self:stretch}
.row .nm{font-weight:700;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.row .nm small{font-weight:500;color:var(--ink2);font-size:.8rem}
.row .wt{font-size:.92rem;color:var(--ink2)}
.libs{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.lib{font-size:.78rem;border:1px solid var(--rule);border-radius:5px;padding:1px 7px;background:var(--paper)}
.flag{color:var(--pink);font-size:.8rem;font-weight:600}

/* generic blocks */
.cols{display:grid;grid-template-columns:1fr;gap:14px;margin-top:12px}
@media (min-width:860px){.cols{grid-template-columns:1fr 1fr}}
.box{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:15px 17px}
.box.key{border:2px solid var(--ink)}
ul.plain,ol.plain{margin:0;padding-left:1.2em}
ul.plain li,ol.plain li{margin:6px 0}
.src{display:inline-block;font-size:.72rem;font-weight:700;border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:1px}
.src.stated{background:var(--ink);color:var(--paper)}
.src.proposed{border:1px solid var(--pink);color:var(--pink)}
.src.checked{border:1px solid var(--ink2);color:var(--ink2)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.92rem}
th,td{text-align:left;border-bottom:1px solid var(--rule);padding:8px 10px;vertical-align:top}
th{font-weight:700;background:var(--sheet)}
td:first-child{font-weight:700;white-space:nowrap}
pre{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px;overflow-x:auto;font-size:.84rem;line-height:1.5}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.mchip{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:3px 10px;font-size:.84rem;cursor:pointer}
.ov{padding:14px 0;border-bottom:1px solid var(--rule)}
.ov h3{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}

/* graph */
.tierbars{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0 6px}
.tb{font-size:.84rem}
.tb b{display:block;font-size:.92rem}
.tb .track{height:6px;border-radius:3px;background:var(--rule);margin-top:5px;overflow:hidden}
.tb .fill{height:100%;background:var(--built)}
.kg-ring{fill:none;stroke:var(--rule);stroke-dasharray:2 5}
.kg-rl{fill:var(--ink2);font-size:12px;font-weight:700;paint-order:stroke;stroke:var(--sheet);stroke-width:5px}
.kg-e{stroke:var(--ink2);stroke-width:1.2;opacity:.18;fill:none}
.kg-e.on{stroke:var(--ink);opacity:.85;stroke-width:2}
.kg-e.off{opacity:.05}
.kg-n{cursor:pointer}
.kg-n .core{stroke:var(--sheet);stroke-width:2}
.kg-n.ready .core{fill:var(--built)}
.kg-n.prog .core{fill:var(--idea)}
.kg-n.none .core{fill:var(--sheet);stroke:var(--ink2);stroke-width:1.5}
.kg-n .trk{fill:none;stroke:var(--rule);stroke-width:4}
.kg-n .arc{fill:none;stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.kg-n .notch{stroke:var(--pink);stroke-width:3}
.kg-n text{fill:var(--ink);font-size:12px;font-weight:600;paint-order:stroke;stroke:var(--sheet);stroke-width:4px;pointer-events:none}
.kg-n.center text{font-size:16px;font-weight:800}
.kg-n.sel .core{stroke:var(--glow);stroke-width:4}
.kg-n.dim{opacity:.2}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,15,25,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
aside.panel{position:fixed;z-index:21;background:var(--sheet);color:var(--ink);border:1px solid var(--rule);left:0;right:0;bottom:0;max-height:84vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s ease}
aside.panel.on{transform:none}
@media (min-width:900px){aside.panel{left:auto;top:0;bottom:0;width:440px;max-height:none;border-radius:0;transform:translateX(105%);padding-top:calc(18px + env(safe-area-inset-top,0px))}}
.panel .x{float:right}
.panel h3.title{font-size:1.45rem;margin:2px 0 6px;letter-spacing:-.015em}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px;font-size:.84rem}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:999px;padding:2px 10px}
.panel dt{font-weight:700;margin-top:14px;font-size:.9rem}
.panel dd{margin:4px 0 0}
.panel dd.chg{border-left:3px solid var(--pink);padding-left:10px}
.field{display:block;margin-top:10px;font-size:.86rem;font-weight:600}
.field input,.field select,.field textarea{display:block;width:100%;margin-top:4px;padding:7px 9px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);font-weight:400;font-size:.95rem}
.field textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.danger{color:var(--pink);border-color:var(--pink)}
.banner{border-left:3px solid var(--pink);background:var(--sheet);padding:9px 12px;border-radius:0 8px 8px 0;margin:0 0 10px;font-size:.92rem;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
textarea.json{width:100%;min-height:240px;font-size:.8rem;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);padding:8px}
@media (prefers-reduced-motion:reduce){aside.panel,.scrim,.blk{transition:none}}
</style>
</head>

// ---------- stacked plates (cabinet projection)
const K=0.75,ANG=35*Math.PI/180,CX=Math.cos(ANG)*K,CY=Math.sin(ANG)*K;
const PW=760,PD=140,DZ=160,LEFT=250,TOP=110;
function P(ox,oy,x,y,z){return [ox+x+y*CX, oy-y*CY-z];}
const pts=a=>a.map(p=>p.map(v=>v.toFixed(1)).join(",")).join(" ");
function renderStack(){
  const tiers=S.tiers;const N=byId();const rel=sel?related(sel):new Set();
  const H=TOP+tiers.length*DZ+40, W=LEFT+PW+PD*CX+30;
  const svg=$("#stack");svg.setAttribute("viewBox",`0 0 ${Math.round(W)} ${H}`);
  const box=$(".stackwrap");const avail=Math.max(320,box.clientWidth-2);
  const scale=avail<760?Math.max(.62,avail/W):Math.min(1,avail/W);

  let out="";const caps=[];
  tiers.forEach((t,i)=>{
    const oy=TOP+i*DZ+PD*CY;const ox=LEFT;
    const shelf=t.id==="shelf";
    const top=[P(ox,oy,0,0,0),P(ox,oy,PW,0,0),P(ox,oy,PW,PD,0),P(ox,oy,0,PD,0)];
    const front=[P(ox,oy,0,0,0),P(ox,oy,PW,0,0),P(ox,oy,PW,0,-12),P(ox,oy,0,0,-12)];
    out+=`<g class="pl${shelf?" shelf":""}" data-tier="${esc(t.id)}" tabindex="0" role="button" aria-label="Tier ${esc(t.n)}: ${esc(t.title)}">
      <polygon class="pl-shadow" points="${pts(top.map(q=>[q[0]+10,q[1]+16]))}"/><polygon class="pl-front" points="${pts(front)}"/><polygon class="pl-top" points="${pts(top)}"/>
      <text class="pl-num" x="18" y="${oy-28}">${esc(t.n)}</text>
      <text class="pl-t" x="18" y="${oy-8}">${esc(t.title)}</text>
      <text class="pl-s" x="18" y="${oy+9}">${esc(t.sub)}</text></g>`;
    const items=S.nodes.filter(n=>n.tier===t.id);
    const rows=items.length>7?2:1;const per=Math.ceil(items.length/rows)||1;
    const sp=(PW-24)/per;const bw=Math.min(78,sp-22);const bd=rows===2?44:60;
    const placed=items.map((n,k)=>{const r=rows===2?(k<per?1:0):0;const c=rows===2?(r===1?k:k-per):k;
      return {n,x:14+c*sp,y:r===1?PD-bd-12:(rows===2?12:Math.round((PD-bd)/2))};});
    placed.sort((a,b)=>b.y-a.y);
    placed.forEach(({n,x,y})=>{

      const f=[P(ox,oy,x,y,0),P(ox,oy,x+bw,y,0),P(ox,oy,x+bw,y,h),P(ox,oy,x,y,h)];
      const tp=[P(ox,oy,x,y,h),P(ox,oy,x+bw,y,h),P(ox,oy,x+bw,y+bd,h),P(ox,oy,x,y+bd,h)];
      const sd=[P(ox,oy,x+bw,y,0),P(ox,oy,x+bw,y+bd,0),P(ox,oy,x+bw,y+bd,h),P(ox,oy,x+bw,y,h)];
      const ol=[P(ox,oy,x,y,0),P(ox,oy,x+bw,y,0),P(ox,oy,x+bw,y+bd,0),P(ox,oy,x+bw,y+bd,h),P(ox,oy,x,y+bd,h),P(ox,oy,x,y,h)];
      let cls="blk";if(sel===n.id)cls+=" sel";else if(rel.has(n.id))cls+=" rel";else if(sel)cls+=" dim";
      out+=`<g class="${cls}" data-id="${esc(n.id)}" style="--c:${c}" tabindex="0" role="button" aria-label="${esc(n.name)}, ${esc(STATUS[n.status])}"><title>${esc(n.name)}</title>
        <polygon class="sd" points="${pts(sd)}"/><polygon class="tp" points="${pts(tp)}"/><polygon class="f" points="${pts(f)}"/><polygon class="ol" points="${pts(ol)}"/></g>`;
      if(sel===n.id){const a=P(ox,oy,x+bw/2,y+bd/2,h);caps.push(`<text class="cap" x="${a[0].toFixed(1)}" y="${(a[1]-10).toFixed(1)}" text-anchor="middle">${esc(n.name)}</text>`);}

// ---------- knowledge graph
const LVL=()=>S.levels||[["0","Not started"],["1","Runs once"],["2","Usable daily"],["3","Reliable"],["4","Refined"]];
let gzoom=1;
function nodeState(n){const l=+n.lvl||0,m=+n.min||0;return l>=m&&m>0?"ready":l>0?"prog":"none";}
function renderGraph(){
  const tiers=S.tiers.filter(t=>t.id!=="shelf");const N=byId();
  const W=1160,C=W/2,RADII=[0,128,222,302,378,448,516,580],NR=[36,23,19,16,14,13,12,11];
  const pos={};let ring=0;const ringsDrawn=[];
  tiers.forEach((t,ti)=>{
    let items=S.nodes.filter(n=>n.tier===t.id);
    if(ti===0&&items.length){pos[items[0].id]={x:C,y:C,r:NR[0],center:true};items=items.slice(1);}
    if(!items.length)return;ring++;const R=RADII[ring]||RADII[RADII.length-1]+70*(ring-RADII.length+1);const r=NR[ring]||11;
    ringsDrawn.push({R,t});
    const pref=items.map(n=>{const rel=[...related(n.id)].filter(id=>pos[id]&&!pos[id].center);if(!rel.length)return null;
      let sx=0,sy=0;rel.forEach(id=>{sx+=pos[id].x-C;sy+=pos[id].y-C;});return Math.atan2(sy,sx);});
    const idx=items.map((n,k)=>k).sort((a,b)=>{const pa=pref[a],pb=pref[b];if(pa==null&&pb==null)return a-b;if(pa==null)return 1;if(pb==null)return -1;return pa-pb;});
    const step=2*Math.PI/items.length;let sx=0,sy=0,cnt=0;
    idx.forEach((k,j)=>{if(pref[k]!=null){const d=pref[k]-j*step;sx+=Math.cos(d);sy+=Math.sin(d);cnt++;}});
    const off=cnt?Math.atan2(sy,sx):-Math.PI/2+step/2+ring*0.35;
    idx.forEach((k,j)=>{const a=off+j*step;pos[items[k].id]={x:C+R*Math.cos(a),y:C+R*Math.sin(a),r};});
  });
  const H=W;const svg=$("#kg");const wrap=$("#gwrap");const avail=Math.max(320,wrap.clientWidth-2);
  const base=avail<700?Math.max(.55,avail/W):Math.min(1,avail/W);
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.setAttribute("width",Math.round(W*base*gzoom));svg.setAttribute("height",Math.round(H*base*gzoom));
  const rel=sel?related(sel):new Set();let out="";
  ringsDrawn.forEach(({R,t})=>{out+=`<circle class="kg-ring" cx="${C}" cy="${C}" r="${R}"/><text class="kg-rl" x="${C}" y="${C-R-6}" text-anchor="middle">${esc(t.n)} ${esc(t.title)}</text>`;});
  const seen=new Set();
  S.nodes.forEach(n=>{(n.with||[]).forEach(o=>{if(!pos[n.id]||!pos[o])return;const key=[n.id,o].sort().join("|");if(seen.has(key))return;seen.add(key);
    const a=pos[n.id],b=pos[o];const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;const qx=mx+(C-mx)*0.18,qy=my+(C-my)*0.18;
    let cls="kg-e";if(sel)cls+=(n.id===sel||o===sel)?" on":" off";
    out+=`<path class="${cls}" d="M${a.x.toFixed(1)},${a.y.toFixed(1)} Q${qx.toFixed(1)},${qy.toFixed(1)} ${b.x.toFixed(1)},${b.y.toFixed(1)}"/>`;});});
  S.nodes.forEach(n=>{const p=pos[n.id];if(!p)return;const st=nodeState(n);const l=Math.max(0,Math.min(4,+n.lvl||0)),m=Math.max(0,Math.min(4,+n.min||0));
    const ar=p.r+6,circ=2*Math.PI*ar;const na=-Math.PI/2+m/4*2*Math.PI;
    let cls=`kg-n ${st}`;if(p.center)cls+=" center";if(sel===n.id)cls+=" sel";else if(sel&&!rel.has(n.id))cls+=" dim";
    const ly=p.y+p.r+(p.center?26:20);
    out+=`<g class="${cls}" data-id="${esc(n.id)}" tabindex="0" role="button" aria-label="${esc(n.name)}: level ${l} of 4, minimum ${m}"><title>${esc(n.name)}: level ${l}, minimum ${m}</title>
      <circle class="trk" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${ar}"/>
      ${l>0?`<circle class="arc" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${ar}" stroke-dasharray="${(circ*l/4).toFixed(1)} ${circ.toFixed(1)}" transform="rotate(-90 ${p.x.toFixed(1)} ${p.y.toFixed(1)})"/>`:""}
      ${m>0?`<line class="notch" x1="${(p.x+(ar-5)*Math.cos(na)).toFixed(1)}" y1="${(p.y+(ar-5)*Math.sin(na)).toFixed(1)}" x2="${(p.x+(ar+5)*Math.cos(na)).toFixed(1)}" y2="${(p.y+(ar+5)*Math.sin(na)).toFixed(1)}"/>`:""}
      <circle class="core" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${p.r}"/>

}

    <label class="field">Next step<input data-f="next" value="${esc(n.next||"")}"></label>
    <label class="field">What it does<textarea data-f="what">${esc(n.what)}</textarea></label>
    <label class="field">Possible libraries, one per line<textarea data-f="libs">${esc((n.libs||[]).join("\n"))}</textarea></label>
    <label class="field">Open point (optional)<textarea data-f="note">${esc(n.note||"")}</textarea></label>
    <div style="margin-top:14px;font-weight:700">Works with</div>
    <div class="chiprow">${(n.with||[]).filter(id=>N[id]).map(id=>`<button class="mchip" type="button" data-unlink="${esc(id)}" aria-label="Remove ${esc(N[id].name)}">${esc(N[id].name)} ×</button>`).join("")}</div>
    <div class="two"><select id="linkSel" class="field" style="margin:0;padding:7px;border:1px solid var(--rule);border-radius:8px;background:var(--paper)">${others}</select><button class="btn" type="button" id="linkAdd">Add</button></div>
    <div class="toolbar" style="margin-top:16px"><button class="btn" type="button" id="mvUp">Move up in tier</button><button class="btn" type="button" id="mvDn">Move down</button></div>
    <button class="btn danger" type="button" id="delNode" style="margin-top:14px">Delete ${esc(n.name)}</button>`;
    pBody.querySelectorAll("[data-f]").forEach(el=>el.addEventListener(el.tagName==="SELECT"?"change":"input",()=>{const f=el.dataset.f;
      if(f==="libs")n.libs=el.value.split("\n").map(s=>s.trim()).filter(Boolean);else if(f==="note"){if(el.value.trim())n.note=el.value;else delete n.note;}else if(f==="lvl"||f==="min"){n[f]=+el.value;delete n.est;n.upd=new Date().toISOString().slice(0,10)+" (edited here)";}else n[f]=el.value;
      markDirty();renderSel();if(f==="name")$("#pTitle").textContent="Edit "+n.name;}));
    $("#linkAdd").onclick=()=>{const v=$("#linkSel").value;if(!v)return;n.with=n.with||[];n.with.push(v);markDirty();renderSel();renderPanel();};
    pBody.querySelectorAll("[data-unlink]").forEach(b=>b.onclick=()=>{const id=b.dataset.unlink;n.with=(n.with||[]).filter(x=>x!==id);const o=N[id];if(o&&o.with)o.with=o.with.filter(x=>x!==n.id);markDirty();renderSel();renderPanel();});
    const move=d=>{const sib=S.nodes.filter(x=>x.tier===n.tier);const k=sib.indexOf(n);const j=k+d;if(j<0||j>=sib.length)return;const a=S.nodes.indexOf(n),b=S.nodes.indexOf(sib[j]);[S.nodes[a],S.nodes[b]]=[S.nodes[b],S.nodes[a]];markDirty();renderSel();};
    $("#mvUp").onclick=()=>move(-1);$("#mvDn").onclick=()=>move(1);
    $("#delNode").onclick=()=>{if(!confirm(`Delete ${n.name}?`))return;S.nodes=S.nodes.filter(x=>x.id!==n.id);S.nodes.forEach(x=>{if(x.with)x.with=x.with.filter(y=>y!==n.id);});sel=null;markDirty();renderAll();closePanel();};
  }
  const sTa=$("#seedTa");if(sTa)sTa.addEventListener("input",()=>{if(sTa.value.trim())n.seed=sTa.value;else delete n.seed;markDirty();});
  $("#pClose").onclick=closePanel;
  pBody.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{sel=b.dataset.jump;renderSel();renderPanel();});
}


// ---------- stages
function stagesOf(id){return (S.stages||[]).flatMap(st=>st.nodes.filter(sn=>sn.id===id).map(sn=>({st,sn})));}
function pState(n){return n&&n.plan?"planned":n&&n.seed?"seeded":"empty";}
const PST={planned:"Planned",seeded:"Notes written",empty:"Needs your notes"};
function renderStages(){const N=byId();const host=$("#stageList");if(!host)return;
  host.innerHTML=(S.stages||[]).map(st=>{
    const ids=st.nodes.map(x=>x.id),dep={};st.nodes.forEach(x=>dep[x.id]=(x.deps||[]).filter(d=>ids.includes(d)));
    const depth={};const dget=(id,seen=new Set())=>{if(depth[id]!=null)return depth[id];if(seen.has(id))return 0;seen.add(id);const ds=dep[id]||[];return depth[id]=ds.length?1+Math.max(...ds.map(d=>dget(d,seen))):0;};
    ids.forEach(id=>dget(id));const cols={};ids.forEach(id=>{(cols[depth[id]]=cols[depth[id]]||[]).push(id);});
    const W=176,H=46,GX=56,GY=16,ncol=Math.max(...Object.keys(cols).map(Number))+1,nrow=Math.max(...Object.values(cols).map(c=>c.length));
    const pos={};Object.entries(cols).forEach(([c,list])=>list.forEach((id,r)=>pos[id]={x:10+c*(W+GX),y:10+r*(H+GY)}));
    const w=20+ncol*W+(ncol-1)*GX,h=20+nrow*H+(nrow-1)*GY;
    const short=t=>t.length>24?t.slice(0,23)+"…":t;
    const edges=ids.flatMap(id=>(dep[id]||[]).map(d=>{const a=pos[d],b=pos[id];const x1=a.x+W,y1=a.y+H/2,x2=b.x,y2=b.y+H/2,mx=(x1+x2)/2;return `<path class="sgedge" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`;})).join("");
    const nodes=ids.map(id=>{const n=N[id];if(!n)return"";const sn=st.nodes.find(x=>x.id===id);const p=pos[id];
      return `<g class="sgnode ${pState(n)}" data-sgo="${esc(id)}" tabindex="0" role="button" aria-label="${esc(n.name)}"><rect x="${p.x}" y="${p.y}" width="${W}" height="${H}" rx="10"/><text x="${p.x+10}" y="${p.y+19}" font-weight="700">${esc(short(n.name))}</text><text x="${p.x+10}" y="${p.y+36}" fill="var(--ink2)">Level ${+n.lvl||0} → ${sn.target}</text></g>`;}).join("");
    const cards=st.nodes.map(sn=>{const n=N[sn.id];if(!n)return"";const ps=pState(n);
      return `<div class="stagecard"><h4>${esc(n.name)}<span class="pstate ${ps}">${PST[ps]}</span></h4><p style="margin:2px 0" class="small">Level ${+n.lvl||0} → ${sn.target}. ${esc(sn.build)}</p>${(sn.deps||[]).length?`<div class="chiprow">${sn.deps.filter(d=>N[d]).map(d=>`<span class="mchip" style="cursor:default">needs ${esc(N[d].name)}</span>`).join("")}</div>`:""}<button class="btn" type="button" data-sgo="${esc(sn.id)}" style="margin-top:6px">Notes and plan</button></div>`;}).join("");
    return `<div class="box" style="margin-bottom:18px"><h3>${esc(st.title)}</h3><p class="muted">${esc(st.goal)}</p><div class="stackwrap" style="padding:6px"><svg class="sgraph" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(st.title)} dependency graph">${edges}${nodes}</svg></div>${cards}<button class="btn" type="button" data-copy="${esc(st.id)}" style="margin-top:8px">Copy this stage for Claude Code</button><textarea class="json" data-out="${esc(st.id)}" style="display:none;min-height:160px;margin-top:8px" readonly></textarea></div>`;}).join("");
}
function stageMarkdown(st){const N=byId();return `# ${st.title}\n\n${st.goal}\n\n`+st.nodes.map(sn=>{const n=N[sn.id]||{};return `## ${n.name} (level ${+n.lvl||0} → ${sn.target})\nKind: ${n.kind||"?"}\nNeeds: ${(sn.deps||[]).map(d=>(N[d]||{}).name).join(", ")||"nothing"}\nBuild in this stage: ${sn.build}\nMinimum: ${n.minDef||""}\n\nYour notes:\n${n.seed||"(none yet)"}\n\nPlan:\n${n.plan||"(not written yet)"}\n`;}).join("\n");}
document.addEventListener("click",e=>{const g=e.target.closest("[data-sgo]");if(g){openNode(g.dataset.sgo);return;}
  const c=e.target.closest("[data-copy]");if(c){const st=(S.stages||[]).find(x=>x.id===c.dataset.copy);if(!st)return;const md=stageMarkdown(st);const ta=document.querySelector(`[data-out="${c.dataset.copy}"]`);ta.value=md;ta.style.display="block";
    try{navigator.clipboard.writeText(md).then(()=>{c.textContent="Copied. Also shown below.";},()=>{c.textContent="Select the text below and copy it.";});}catch(_){c.textContent="Select the text below and copy it.";}}});
document.addEventListener("keydown",e=>{if(e.key!=="Enter")return;const g=e.target.closest&&e.target.closest("g[data-sgo]");if(g)openNode(g.dataset.sgo);});

// ---------- other views
function renderContracts(){
  const C=S.contracts;
  $("#statedRules").innerHTML=C.stated.map(r=>`<li>${esc(r)} <span class="src stated">your rule</span></li>`).join("");
  $("#together").innerHTML=(C.together||[]).map(x=>`<li>${esc(x)}</li>`).join("");
  $("#tmpl").innerHTML=C.template.map(r=>`<tr><td>${esc(r.f)}</td><td>${esc(r.r)}</td></tr>`).join("");
  $("#extAgents").innerHTML=C.agents.map(a=>`<div class="box"><h3>${esc(a.name)}</h3><p class="muted small" style="margin:0 0 8px">${esc(a.role)}</p>
    <div class="tablewrap"><table style="min-width:0"><tbody>${a.rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])} <span class="src ${r[2]===1?"stated":r[2]===2?"checked":"proposed"}">${r[2]===1?"your rule":r[2]===2?"checked 22 Oct":"proposed"}</span></td></tr>`).join("")}</tbody></table></div></div>`).join("");
}
function renderOverlaps(){const N=byId();
  $("#ovList").innerHTML=S.overlaps.map(o=>`<div class="ov"><h3>${esc(o.t)} <span class="src proposed">proposed fix</span></h3>
  <div class="chiprow">${(o.m||[]).filter(id=>N[id]).map(id=>`<button class="mchip" type="button" data-goto="${esc(id)}">${esc(N[id].name)}</button>`).join("")}${(o.extra||[]).map(x=>`<span class="mchip" style="cursor:default">${esc(x)}</span>`).join("")}</div>
  <p style="margin:4px 0">${esc(o.issue)}</p><p style="margin:4px 0"><b>Fix:</b> ${esc(o.p)}</p></div>`).join("");}
document.addEventListener("click",e=>{const g=e.target.closest("[data-goto]");if(!g)return;location.hash="#plan";setTimeout(()=>openNode(g.dataset.goto),30);});
function renderShelf(){
  $("#shelfList").innerHTML=S.nodes.filter(n=>n.tier==="shelf").map(n=>`<li><b>${esc(n.name)}</b>: ${esc(n.what)} <span class="muted small">Libraries: ${esc((n.libs||[]).join(", "))}</span></li>`).join("");
  $("#retiredList").innerHTML=S.retired.map(r=>`<li><b>${esc(r.name)}</b>: ${esc(r.why)}</li>`).join("");
}

// ---------- editing + saving
function markDirty(){dirty=JSON.stringify(S)!==SAVED;try{dirty?localStorage.setItem(DRAFT,JSON.stringify(S)):localStorage.removeItem(DRAFT);}catch(_){}updateStatus();renderJson();}
function updateStatus(){const st=$("#saveStatus");$("#saveBtn").hidden=!dirty;$("#discardBtn").hidden=!dirty;
  if(dirty){st.className="status dirty";st.textContent=canSave===false?"Unsaved. Saving isn’t available in this view; changes stay in this browser.":"Unsaved changes";}
  else{st.className="status";st.textContent=canSave===false?"Read-only here":"";}}
$("#editBtn").onclick=()=>{editing=!editing;$("#editBtn").setAttribute("aria-pressed",editing);$("#editBtn").textContent=editing?"Done editing":"Edit";$("#addNode").hidden=!editing;if(panel.classList.contains("on"))renderPanel();};
$("#addNode").onclick=()=>{const ids=new Set(S.nodes.map(n=>n.id));let i=1;while(ids.has("new"+i))i++;const n={id:"new"+i,tier:"p5",status:"idea",name:"New component",what:"",libs:[],with:[]};S.nodes.push(n);markDirty();renderAll();openNode(n.id);};
$("#discardBtn").onclick=()=>{if(!confirm("Discard all unsaved changes?"))return;S=JSON.parse(SAVED);sel=null;markDirty();renderAll();closePanel();};
function buildDoc(state){
  const css=document.getElementById("app-css").textContent;const js=document.getElementById("app-js").textContent;
  const data=JSON.stringify(state).replace(/</g,"\\u003c");
  const font=document.head.querySelector('link[href*="fonts.googleapis.com/css2"]').getAttribute("href");
  return "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>AI OS plan</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\""+font+"\" rel=\"stylesheet\">\n<style id=\"app-css\">"+css+"</"+"style>\n</head>\n<body>\n<div id=\"root\"></div>\n<script type=\"application/json\" id=\"state\">\n"+data+"\n</"+"script>\n<script id=\"app-js\">"+js+"</"+"script>\n</body>\n</html>\n";
}
$("#saveBtn").onclick=async()=>{if(!artifactNS){updateStatus();return;}
  S.updated=new Date().toISOString().slice(0,10);const html=buildDoc(S);const st=$("#saveStatus");st.textContent="Saving…";$("#saveBtn").disabled=true;
  let draft=null;try{draft=localStorage.getItem(DRAFT);localStorage.removeItem(DRAFT);}catch(_){}
  try{await artifactNS.publish(html);st.textContent="Saved";}
  catch(err){try{if(draft)localStorage.setItem(DRAFT,draft);}catch(_){}const c=err&&err.code;$("#saveBtn").disabled=false;
    if(c==="conflict")st.textContent="A newer version was saved; reloading to it. Your changes are kept as a draft.";
    else if(["not_writer","not_granted","capability_disabled","not_declared"].includes(c)){canSave=false;updateStatus();}
    else if(c==="rate_limited")st.textContent="Saving too often. Wait a moment, then save again.";
    else st.textContent="Couldn’t save. Your changes are kept in this browser; try again.";}};
function renderJson(){const ta=$("#jsonTa");if(document.activeElement!==ta)ta.value=JSON.stringify(S,null,1);}
$("#copyJson").onclick=async()=>{const ta=$("#jsonTa");ta.select();let ok=false;try{await navigator.clipboard.writeText(ta.value);ok=true;}catch(_){try{ok=document.execCommand("copy");}catch(__){}}$("#jsonStatus").textContent=ok?"Copied":"Select the text and copy it manually";};
$("#applyJson").onclick=()=>{try{const v=JSON.parse($("#jsonTa").value);if(!Array.isArray(v.nodes)||!Array.isArray(v.tiers))throw 0;S=v;sel=null;markDirty();renderAll();$("#jsonStatus").textContent="Applied. Save to keep it.";}catch(_){$("#jsonStatus").textContent="That isn’t valid plan JSON (needs tiers and nodes).";}};
const SNIP=`## AI OS status file
Keep aios-status.json at the repo root. At the end of every session that changes
a component, update its entry. Ids must match the AI OS plan page.
Levels: 0 not started, 1 runs once, 2 usable daily, 3 reliable, 4 refined.
Only raise a level with evidence (a command that ran, a test that passed).
Format:
{"updated":"YYYY-MM-DD","nodes":[
  {"id":"todo","lvl":1,"working":"what works now","next":"the next step"}
]}
Optional per node: "min" and "minDef" if the minimum should change.
Known ids: ${S.nodes.filter(n=>n.tier!=="shelf").map(n=>n.id).join(", ")}`;
$("#ccSnippet").textContent=SNIP;
$("#copySnippet").onclick=async()=>{let ok=false;try{await navigator.clipboard.writeText(SNIP);ok=true;}catch(_){}$("#copySnippet").textContent=ok?"Copied":"Select the text above and copy it";};
$("#mergeStatus").onclick=()=>{const msg=$("#mergeMsg");let v;try{v=JSON.parse($("#statusTa").value);}catch(_){msg.textContent="That isn’t valid JSON.";return;}
  const list=Array.isArray(v)?v:v.nodes;if(!Array.isArray(list)){msg.textContent="Expected a nodes list.";return;}
  const N=byId();const unknown=[];let n=0;const date=(!Array.isArray(v)&&v.updated)||new Date().toISOString().slice(0,10);
  list.forEach(x=>{const t=N[x&&x.id];if(!t){unknown.push(x&&x.id);return;}["lvl","min"].forEach(k=>{if(x[k]!=null&&!isNaN(+x[k]))t[k]=Math.max(0,Math.min(4,+x[k]));});
    ["minDef","working","next"].forEach(k=>{if(typeof x[k]==="string")t[k]=x[k];});delete t.est;t.upd=date+" (Claude Code)";n++;});
  markDirty();renderAll();msg.textContent=`Updated ${n} component${n===1?"":"s"}.${unknown.length?" Unknown ids: "+unknown.join(", ")+".":""} Save to keep it.`;};
function checkDraft(){let d=null;try{d=localStorage.getItem(DRAFT);}catch(_){}if(!d||d===SAVED)return;const b=$("#draftBanner");
  b.innerHTML=`<div class="banner">You have unsaved changes from an earlier visit in this browser.<button class="btn" type="button" id="restoreD">Restore them</button><button class="btn" type="button" id="dropD">Discard</button></div>`;
  $("#restoreD").onclick=()=>{try{S=JSON.parse(d);}catch(_){}b.innerHTML="";markDirty();renderAll();};$("#dropD").onclick=()=>{try{localStorage.removeItem(DRAFT);}catch(_){}b.innerHTML="";};}

const VIEWS=["graph","plan","stages","contracts","overlaps","agents","retired","data"];
function show(){const t=(location.hash||"#graph").slice(1);const v=VIEWS.includes(t)?t:"graph";
  VIEWS.forEach(k=>document.getElementById("v-"+k).classList.toggle("on",k===v));
  document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current",a.getAttribute("href")==="#"+v?"page":"false"));if(v==="plan")renderStack();if(v==="graph")renderGraph();}
window.addEventListener("hashchange",()=>{show();window.scrollTo({top:0});});
function renderAll(){renderPrinciples();renderSel();renderContracts();renderOverlaps();renderShelf();renderJson();updateStatus();}
show();renderAll();checkDraft();
if(window.claude&&typeof window.claude.use==="function"){window.claude.use("artifact").then(ns=>{artifactNS=ns;canSave=ns?null:false;updateStatus();}).catch(()=>{canSave=false;updateStatus();});}else{canSave=false;updateStatus();}
})();
</script>
</body>
</html>
